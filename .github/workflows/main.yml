name: Build Rescuezilla ARM64 ISO

on:
  push:
    branches: [ nnhq-dev-1 ]
  pull_request:
    branches: [ nnhq-dev-1 ]

jobs:

  build-arm64-iso:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive  # 修复：正确初始化子模块
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-lfs git make sudo \
                         rsync debootstrap gettext squashfs-tools dosfstools mtools xorriso util-linux \
                         devscripts debhelper checkinstall cmake time parallel dpkg-dev partclone \
                         grub-efi-arm64-bin \
                         shim-signed grub-efi-arm64-signed build-essential \
                         libtool-bin gawk pkg-config comerr-dev docbook-xsl e2fslibs-dev fuse3 \
                         libaal-dev libblkid-dev libbsd-dev libncurses5-dev \
                         libncursesw5-dev libntfs-3g89 libreadline-dev libreadline8 readline-common \
                         libreiser4-dev libtinfo-dev libxslt1.1 nilfs-tools ntfs-3g ntfs-3g-dev \
                         quilt sgml-base uuid-dev vmfs-tools xfslibs-dev xfsprogs xml-core \
                         xsltproc ccache libssl-dev \
                         gcc-9 g++-9  # 安装特定版本的 gcc
        
        # 设置 gcc-9 为默认编译器
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
        sudo update-alternatives --set gcc /usr/bin/gcc-9
        sudo update-alternatives --set g++ /usr/bin/g++-9
        
        # 验证编译器版本
        gcc --version
        g++ --version
        
        # 安装 ARM64 交叉编译工具（如果需要）
        # sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        
        # 验证基本工具
        which partclone
        which xorriso
        which mksquashfs
        
    - name: Initialize git LFS
      run: |
        git lfs install
        git lfs pull
        
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        
    - name: Build ISO
      run: |
        # 构建 ARM64 ISO 镜像
        sudo make oracular
        
    # 添加调试步骤：检查构建输出
    - name: Check build output
      run: |
        echo "=== 检查构建输出 ==="
        ls -la build/
        echo "=== 检查 ISO 文件 ==="
        if [ -f build/rescuezilla.arm64.oracular.iso ]; then
          echo "ISO 文件存在，大小: $(ls -lh build/rescuezilla.arm64.oracular.iso | awk '{print $5}')"
          # 检查 ISO 内容
          mkdir -p iso_check
          sudo mount -o loop build/rescuezilla.arm64.oracular.iso iso_check 2>/dev/null || true
          if [ -d iso_check ]; then
            echo "=== ISO 内容 ==="
            ls -la iso_check/
            echo "=== EFI 目录 ==="
            ls -la iso_check/EFI/ 2>/dev/null || echo "无 EFI 目录"
            echo "=== boot 目录 ==="
            ls -la iso_check/boot/ 2>/dev/null || echo "无 boot 目录"
            echo "=== casper 目录 ==="
            ls -la iso_check/casper/ 2>/dev/null || echo "无 casper 目录"
            sudo umount iso_check 2>/dev/null || true
          fi
          rmdir iso_check 2>/dev/null || true
        else
          echo "错误：ISO 文件未生成"
          ls -la build/
        fi

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: rescuezilla-arm64.iso
        path: build/rescuezilla.arm64.oracular.iso
       
    - name: Upload release assets (on tag push)
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      with:
        files: |
          build/rescuezilla.arm64.oracular.iso
