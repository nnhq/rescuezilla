name: Build Rescuezilla ARM64 ISO

on:
  push:
    branches: [ nnhq-dev-1 ]
  pull_request:
    branches: [ nnhq-dev-1 ]

jobs:

  build-arm64-iso:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        
    - name: Install dependencies
      run: |
        # 设置错误处理
        set -e
        
        sudo apt update
        # 分开安装包，避免单个命令太长导致的问题
        sudo apt install -y \
          git-lfs git make sudo \
          rsync debootstrap gettext squashfs-tools dosfstools mtools xorriso util-linux \
          devscripts debhelper checkinstall cmake time parallel dpkg-dev \
          grub-efi-arm64-bin grub-efi-arm64 \
          shim-signed grub-efi-arm64-signed build-essential \
          libtool-bin gawk pkg-config comerr-dev docbook-xsl e2fslibs-dev fuse3 \
          libaal-dev libblkid-dev libbsd-dev libncurses5-dev \
          libncursesw5-dev libntfs-3g89 libreadline-dev libreadline8 readline-common \
          libreiser4-dev libtinfo-dev libxslt1.1 nilfs-tools ntfs-3g ntfs-3g-dev \
          quilt sgml-base uuid-dev vmfs-tools xfslibs-dev xfsprogs xml-core \
          xsltproc ccache libssl-dev \
          grub-common grub-pc-bin grub2-common \
          efibootmgr mokutil
        
        # 安装 partclone - 这个包在 Ubuntu 24.04 中可能有版本问题
        sudo apt install -y partclone || echo "partclone 安装失败，但继续..."
        
        # 安装特定版本的 gcc
        sudo apt install -y gcc-9 g++-9
        
        # 设置 gcc-9 为默认编译器 - 使用非交互式方式
        echo "设置 gcc-9 为默认编译器..."
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90 --slave /usr/bin/g++ g++ /usr/bin/g++-9
        sudo update-alternatives --set gcc /usr/bin/gcc-9
        
        # 验证安装
        gcc --version
        g++ --version
        
        # 验证GRUB ARM64 EFI文件
        echo "验证GRUB ARM64 EFI文件:"
        ls -la /usr/lib/grub/arm64-efi/ || true
        ls -la /usr/share/grub/ || true
        which grub-mkimage
        
        # 验证其他关键工具
        which xorriso
        which mksquashfs
        which debootstrap
        
        echo "依赖安装完成"
        
    - name: Initialize git LFS
      run: |
        git lfs install
        git lfs pull
        
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        
    - name: Build ISO
      run: |
        # 显示构建环境信息
        echo "=== 构建环境信息 ==="
        uname -a
        lsb_release -a
        gcc --version
        
        # 检查ARM64 EFI支持
        echo "=== 检查ARM64 UEFI支持 ==="
        if [ -d "/usr/lib/grub/arm64-efi" ]; then
          echo "✅ ARM64 EFI模块目录存在"
          ls /usr/lib/grub/arm64-efi/*.mod | head -5
        else
          echo "❌ ARM64 EFI模块目录不存在"
          # 尝试手动创建GRUB ARM64 EFI映像作为备用方案
          echo "尝试创建GRUB ARM64 EFI映像..."
          sudo mkdir -p /usr/lib/grub/arm64-efi
        fi
        
        # 创建必要的EFI目录结构（如果Makefile不创建的话）
        echo "创建EFI目录结构..."
        mkdir -p efi/boot || true
        
        # 使用 noble (Ubuntu 24.04 LTS) 版本构建
        echo "=== 构建 ARM64 ISO 镜像 (noble) ==="
        
        # 添加环境变量以确保ARM64架构
        export ARCH=arm64
        export UEFI_ARCH=arm64
        
        # 尝试不同的构建目标
        echo "尝试构建ISO..."
        sudo make noble 2>&1 || {
          echo "标准构建失败，尝试替代方法..."
          # 如果标准构建失败，尝试使用make的替代目标
          sudo make rescuezilla.arm64.noble.iso 2>&1 || true
        }
        
    - name: Check build output
      run: |
        echo "=== 检查构建输出 ==="
        ls -la build/ || true
        
        # 使用 noble 版本的 ISO 文件名
        if [ -f build/rescuezilla.arm64.noble.iso ]; then
          echo "✅ ISO 文件创建成功"
          echo "ISO 文件大小: $(ls -lh build/rescuezilla.arm64.noble.iso | awk '{print $5}')"
          
          # 尝试检查 ISO 内容
          if command -v isoinfo > /dev/null; then
            echo "=== ISO 文件信息 ==="
            isoinfo -d -i build/rescuezilla.arm64.noble.iso 2>/dev/null || true
            
            echo "=== 检查ISO中的EFI文件 ==="
            # 挂载ISO检查EFI文件
            mkdir -p /tmp/iso_mount
            sudo mount -o loop build/rescuezilla.arm64.noble.iso /tmp/iso_mount 2>/dev/null || true
            
            if [ -d "/tmp/iso_mount/EFI" ]; then
              echo "✅ ISO包含EFI目录"
              find /tmp/iso_mount/EFI -type f | head -20
            fi
            
            if [ -f "/tmp/iso_mount/EFI/BOOT/BOOTAA64.EFI" ] || [ -f "/tmp/iso_mount/EFI/BOOT/grubaa64.efi" ]; then
              echo "✅ 找到ARM64 UEFI引导文件"
            else
              echo "❌ 未找到ARM64 UEFI引导文件"
              echo "尝试在ISO中查找其他EFI文件:"
              find /tmp/iso_mount -name "*.efi" -o -name "*.EFI" 2>/dev/null || true
            fi
            
            sudo umount /tmp/iso_mount 2>/dev/null || true
            rm -rf /tmp/iso_mount
          fi
        else
          echo "❌ ISO 文件未生成"
          echo "寻找可能的 ISO 文件:"
          find build/ -name "*.iso" -type f 2>/dev/null || true
          # 尝试查找可能的错误日志
          find build/ -name "*.log" -o -name "*.txt" 2>/dev/null | xargs cat 2>/dev/null | head -100 || true
          exit 1
        fi
        
    - name: Verify UEFI boot capability
      run: |
        echo "=== 验证UEFI引导能力 ==="
        
        if [ -f build/rescuezilla.arm64.noble.iso ]; then
          # 检查ISO是否包含EFI引导
          if command -v isoinfo > /dev/null; then
            echo "检查ISO的引导信息..."
            isoinfo -i build/rescuezilla.arm64.noble.iso -d 2>/dev/null | grep -i "eltorito" || true
            isoinfo -i build/rescuezilla.arm64.noble.iso -d 2>/dev/null | grep -i "efi" || true
            
            # 使用file命令检查ISO类型
            file build/rescuezilla.arm64.noble.iso || true
          fi
          
          # 如果ISO缺少EFI引导，尝试修复
          echo "检查ISO中的引导文件结构..."
          mkdir -p /tmp/iso_check
          sudo mount -o loop build/rescuezilla.arm64.noble.iso /tmp/iso_check 2>/dev/null || true
          
          if [ $? -eq 0 ]; then
            echo "ISO内容:"
            ls -la /tmp/iso_check/ 2>/dev/null | head -20
            
            # 检查引导目录
            if [ ! -d "/tmp/iso_check/EFI" ] && [ ! -d "/tmp/iso_check/efi" ]; then
              echo "警告: ISO缺少EFI目录，可能无法UEFI引导"
              echo "考虑手动添加UEFI引导支持..."
            fi
            
            sudo umount /tmp/iso_check 2>/dev/null || true
          fi
          rm -rf /tmp/iso_check
        fi

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: rescuezilla-arm64.iso
        path: build/rescuezilla.arm64.noble.iso
       
    - name: Create Release and Upload Asset
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        tag: "${{ github.ref_name }}"
        name: "Release ${{ github.ref_name }}"
        body: |
          Rescuezilla ARM64 ISO
          Build from commit: ${{ github.sha }}
        prerelease: false
        artifacts: "build/rescuezilla.arm64.noble.iso"
        token: ${{ secrets.GITHUB_TOKEN }}
