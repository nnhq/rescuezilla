name: Build Rescuezilla ARM64 ISO

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # 在 jobs 部分添加 ARM64 构建作业

  rescuezilla-iso-build-amd64:
    # ... 原有 AMD64 构建步骤保持不变，但需要为每个 make 命令添加 UEFI_ONLY=1
    # 例如：
    - name: Make Ubuntu 24.10 (Oracular) ISO
      run: make docker-oracular UEFI_ONLY=1
    
  rescuezilla-iso-build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - run: echo "RESCUEZILLA_RELEASE_NAME=\"$(git grep -h -E -o '[a-zA-Z].*)' CHANGELOG | head -1)\"" >> $GITHUB_ENV
      - run: echo "DEB_VERSION=$(git describe --tags  --match='[0-9].[0-9]*' --abbrev=0)" >> $GITHUB_ENV

      - name: Install ARM64 cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static binfmt-support

      - name: Build Docker image
        run: make docker-build

      - name: Launch Docker container
        run: make docker-run

      - name: Trust the git folder
        run: make docker-add-safe-directory

      - name: Create completed artifacts folder
        run: mkdir completed-artifacts-arm64/

      # 构建 ARM64 UEFI-only ISO 镜像
      - run: make docker-status
      - name: Make Ubuntu 25.04 (Plucky) ISO (ARM64, UEFI-only)
        run: make docker-plucky-arm64
      - run: sudo mv build/rescuezilla.arm64.plucky.iso completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.plucky.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 24.04 LTS (Noble) ISO (ARM64, UEFI-only)
        run: make docker-noble-arm64
      - run: sudo mv build/rescuezilla.arm64.noble.iso completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.noble.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 24.10 (Oracular) ISO (ARM64, UEFI-only)
        run: make docker-oracular-arm64
      - run: sudo mv build/rescuezilla.arm64.oracular.iso completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.oracular.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 22.04 LTS (Jammy) ISO (ARM64, UEFI-only)
        run: make docker-jammy-arm64
      - run: sudo mv build/rescuezilla.arm64.jammy.iso completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.jammy.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 20.04 LTS (Focal) ISO (ARM64, UEFI-only)
        run: make docker-focal-arm64
      - run: sudo mv build/rescuezilla.arm64.focal.iso completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.focal.iso
      - run: sudo make clean-all

      # 创建校验和
      - name: Create checksums for ARM64 ISO images
        run: cd completed-artifacts-arm64 && sudo ../src/scripts/create-iso-checksums.sh rescuezilla-${{github.ref_name}}-*.iso

      # 上传 ARM64 artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.plucky.iso
          path: completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.plucky.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.noble.iso
          path: completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.noble.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.oracular.iso
          path: completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.oracular.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.jammy.iso
          path: completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.jammy.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.focal.iso
          path: completed-artifacts-arm64/rescuezilla-${{github.ref_name}}-arm64.focal.iso
