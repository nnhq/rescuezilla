# On push [1]
# [1] https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
on: [push]
jobs:
  rescuezilla-iso-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
          fetch-depth: 0

      - name: Setup Git Configuration
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://".insteadOf git://
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Initialize Submodules with Error Recovery
        run: |
          # Try normal submodule initialization first
          git submodule sync --recursive
          
          # Initialize each submodule individually with error handling
          for submodule in src/third-party/debootstrap src/third-party/partclone-latest src/third-party/partclone-nbd src/third-party/partclone-utils src/third-party/util-linux; do
            echo "Initializing $submodule"
            if ! git submodule update --init --depth 1 "$submodule"; then
              echo "Failed to initialize $submodule with specific commit, trying latest..."
              
              # Get the submodule URL
              submodule_url=$(git config --file .gitmodules --get "submodule.$submodule.url")
              echo "Cloning $submodule_url into $submodule"
              
              # Remove any existing directory
              rm -rf "$submodule"
              
              # Clone the latest version
              git clone --depth 1 "$submodule_url" "$submodule"
              
              # Update the gitmodules to point to latest commit
              cd "$submodule"
              latest_commit=$(git rev-parse HEAD)
              echo "Latest commit for $submodule: $latest_commit"
              cd - > /dev/null
            fi
          done

      - name: Verify Submodules
        run: |
          echo "Checking submodule status:"
          git submodule status --recursive
          echo "Listing submodule directories:"
          find src/third-party/ -type d -name ".git" | head -10

      # Extract human-readable version string from the most recent CHANGELOG entry
      - name: Extract Version Information
        run: |
          echo "RESCUEZILLA_RELEASE_NAME=\"$(git grep -h -E -o '[a-zA-Z].*)' CHANGELOG | head -1 || echo 'Development Build')\"" >> $GITHUB_ENV
          echo "DEB_VERSION=$(git describe --tags --match='[0-9].[0-9]*' --abbrev=0 2>/dev/null || echo '1.0.0'))" >> $GITHUB_ENV

      - name: Generate release notes (and set default release in notes)
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          if [ -f "src/scripts/update/generate-release-notes.sh" ]; then
            cd src/scripts/update
            chmod +x generate-release-notes.sh
            ./generate-release-notes.sh ${{github.ref_name}} "oracular" > /tmp/release-notes.md || echo "Generated release notes failed, using default"
          else
            echo "Release notes for ${{github.ref_name}}" > /tmp/release-notes.md
          fi
          echo "RELEASE_DATE=$(date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Build Docker image for ARM64
        run: make docker-build-arm64

      - name: Launch Docker container for ARM64
        run: make docker-run-arm64

      - name: Trust the git folder
        run: make docker-add-safe-directory

      - name: Create completed artifacts folder
        run: mkdir -p completed-artifacts/

      - run: make docker-status
      - name: Make ARM64 DEB package
        run: make docker-deb-arm64
      - run: sudo mv build/rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb completed-artifacts/rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb

      - name: Run unit tests within the Docker container
        run: make docker-test

      - run: make docker-status
      - name: Make Ubuntu 25.04 (Plucky) ARM64 UEFI ISO
        run: make docker-plucky-arm64-uefi
      - run: sudo mv build/rescuezilla.arm64.plucky.iso completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.plucky.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 24.04 LTS (Noble) ARM64 UEFI ISO
        run: make docker-noble-arm64-uefi
      - run: sudo mv build/rescuezilla.arm64.noble.iso completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.noble.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 24.10 (Oracular) ARM64 UEFI ISO
        run: make docker-oracular-arm64-uefi
      - run: sudo mv build/rescuezilla.arm64.oracular.iso completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.oracular.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 22.04 LTS (Jammy) ARM64 UEFI ISO [LTS = Long Term Support]
        run: make docker-jammy-arm64-uefi
      - run: sudo mv build/rescuezilla.arm64.jammy.iso completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.jammy.iso
      - run: sudo make clean-all

      - run: make docker-status
      - name: Make Ubuntu 20.04 LTS (Focal) ARM64 UEFI ISO [LTS = Long Term Support]
        run: make docker-focal-arm64-uefi
      - run: sudo mv build/rescuezilla.arm64.focal.iso completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.focal.iso
      - run: sudo make clean-all

      - name: Create checksums for ARM64 ISO images
        run: |
          cd completed-artifacts
          if [ -f "../src/scripts/create-iso-checksums.sh" ]; then
            sudo ../src/scripts/create-iso-checksums.sh rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb rescuezilla-${{github.ref_name}}-*.iso
          else
            # Fallback checksum creation
            for file in *.deb *.iso; do
              [ -f "$file" ] && sha256sum "$file" >> SHA256SUM
              [ -f "$file" ] && md5sum "$file" >> MD5SUM
              [ -f "$file" ] && sha1sum "$file" >> SHA1SUM
            done
          fi

      - name: Upload release assets (on tag push)
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        with:
          name: v${{github.ref_name}} (${{env.RELEASE_DATE}}) ARM64
          body_path: /tmp/release-notes.md
          files: |
            completed-artifacts/*SUM
            completed-artifacts/rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb
            completed-artifacts/rescuezilla-${{github.ref_name}}-*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload GitHub Action workflow artifacts for ARM64 builds

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUM
          path: completed-artifacts/SHA256SUM

      - uses: actions/upload-artifact@v4
        with:
          name: MD5SUM
          path: completed-artifacts/MD5SUM

      - uses: actions/upload-artifact@v4
        with:
          name: SHA1SUM
          path: completed-artifacts/SHA1SUM

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb
          path: completed-artifacts/rescuezilla_${{env.DEB_VERSION}}-1_arm64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.plucky.iso
          path: completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.plucky.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.oracular.iso
          path: completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.oracular.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.noble.iso
          path: completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.noble.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.jammy.iso
          path: completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.jammy.iso

      - uses: actions/upload-artifact@v4
        with:
          name: rescuezilla-${{github.ref_name}}-arm64.focal.iso
          path: completed-artifacts/rescuezilla-${{github.ref_name}}-arm64.focal.iso
