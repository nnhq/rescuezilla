# On push [1]
# [1] https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
on: [push]
jobs:
  build-arm64-iso:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        
    - name: Install dependencies
      run: |
        set -e
        sudo apt update
        sudo apt install -y \
          git-lfs git make sudo \
          rsync debootstrap gettext squashfs-tools dosfstools mtools xorriso util-linux \
          devscripts debhelper checkinstall cmake time parallel dpkg-dev \
          build-essential \
          libtool-bin gawk pkg-config comerr-dev docbook-xsl e2fslibs-dev fuse3 \
          libaal-dev libblkid-dev libbsd-dev libncurses5-dev \
          libncursesw5-dev libntfs-3g89 libreadline-dev libreadline8 \
          libreiser4-dev libtinfo-dev libxslt1.1 nilfs-tools ntfs-3g ntfs-3g-dev \
          quilt sgml-base uuid-dev vmfs-tools xfslibs-dev xfsprogs xml-core \
          xsltproc ccache libssl-dev \
          grub-efi-arm64 grub-efi-arm64-bin \
          grub-common grub2-common \
          efibootmgr
        
        # 尝试安装额外的包，允许失败
        sudo apt install -y grub-efi-arm64-signed || echo "grub-efi-arm64-signed not available"
        sudo apt install -y shim-signed || echo "shim-signed not available"
        sudo apt install -y qemu-efi-aarch64 || echo "qemu-efi-aarch64 not available"
        sudo apt install -y qemu-system-arm || echo "qemu-system-arm not available"
        
        # 安装 partclone
        sudo apt install -y partclone || true
        
        # 安装特定版本的 gcc
        sudo apt install -y gcc-9 g++-9 || {
          echo "gcc-9 not available, using default gcc"
          sudo apt install -y gcc g++
        }
        
        # 设置 gcc-9 为默认编译器（如果安装成功）
        if command -v gcc-9 >/dev/null 2>&1; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90 --slave /usr/bin/g++ g++ /usr/bin/g++-9
          sudo update-alternatives --set gcc /usr/bin/gcc-9
        fi
        
    - name: Initialize git LFS
      run: |
        git lfs install
        git lfs pull
        
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        
    - name: Verify GRUB ARM64 installation
      run: |
        echo "=== 验证 GRUB ARM64 安装 ==="
        ls -la /usr/lib/grub/arm64-efi/ || echo "GRUB ARM64 modules not found"
        find /usr/lib/grub/arm64-efi/ -name "*.mod" | head -5 || echo "No GRUB modules found"
        
        # 查找可用的EFI文件
        find /usr -name "*grub*efi*" -type f 2>/dev/null | head -10
        find /usr -name "*aa64*" -type f 2>/dev/null | head -10
        find /usr -name "*shim*" -type f 2>/dev/null | head -10
        
        echo "=== 检查系统架构 ==="
        uname -m
        dpkg --print-architecture
        
    - name: Build ISO
      run: |
        echo "=== 构建环境信息 ==="
        uname -a
        lsb_release -a
        
        echo "=== 检查ARM64 UEFI支持 ==="
        if [ -d "/usr/lib/grub/arm64-efi" ]; then
          echo "ARM64 EFI模块目录存在"
          ls -la /usr/lib/grub/arm64-efi/ | head -10
        else
          echo "ARM64 EFI模块目录不存在"
        fi
        
        # 设置环境变量以确保构建ARM64 ISO
        export ARCH=arm64
        export TARGET_ARCH=arm64
        
        echo "=== 构建 ARM64 ISO 镜像 (noble) ==="
        sudo make noble ARCH=arm64
        
    - name: Fix EFI boot structure
      run: |
        echo "=== 修复 EFI 引导结构 ==="
        ISO_FILE="build/rescuezilla.arm64.noble.iso"
        
        if [ -f "$ISO_FILE" ]; then
          # 创建临时工作目录
          mkdir -p /tmp/iso_fix
          mkdir -p /tmp/iso_mount
          
          # 挂载原ISO
          sudo mount -o loop "$ISO_FILE" /tmp/iso_mount
          
          # 复制ISO内容到工作目录
          sudo cp -r /tmp/iso_mount/* /tmp/iso_fix/
          sudo umount /tmp/iso_mount
          
          # 确保EFI目录结构正确
          sudo mkdir -p /tmp/iso_fix/EFI/BOOT
          
          # 查找并复制EFI引导文件
          EFI_GRUB=""
          BOOTAA64_EFI=""
          
          # 查找grub EFI文件
          if [ -f "/usr/lib/grub/arm64-efi/monolithic/grubaa64.efi" ]; then
            EFI_GRUB="/usr/lib/grub/arm64-efi/monolithic/grubaa64.efi"
          elif [ -f "/usr/lib/grub/arm64-efi/grub.efi" ]; then
            EFI_GRUB="/usr/lib/grub/arm64-efi/grub.efi"
          fi
          
          # 查找shim或直接使用grub
          if [ -f "/usr/lib/shim/shimaa64.efi.signed" ]; then
            echo "使用 signed shim"
            BOOTAA64_EFI="/usr/lib/shim/shimaa64.efi.signed"
          elif [ -f "/usr/lib/shim/shimaa64.efi" ]; then
            echo "使用 unsigned shim"
            BOOTAA64_EFI="/usr/lib/shim/shimaa64.efi"
          elif [ -n "$EFI_GRUB" ]; then
            echo "直接使用 GRUB EFI"
            BOOTAA64_EFI="$EFI_GRUB"
          else
            echo "警告: 未找到合适的EFI引导文件，尝试生成GRUB EFI"
            # 尝试生成GRUB EFI文件
            grub-mkstandalone \
              --format=arm64-efi \
              --output=/tmp/grubaa64.efi \
              --locales="" \
              --fonts="" \
              "boot/grub/grub.cfg=/tmp/grub_standalone.cfg" || echo "grub-mkstandalone failed"
            
            if [ -f "/tmp/grubaa64.efi" ]; then
              BOOTAA64_EFI="/tmp/grubaa64.efi"
              EFI_GRUB="/tmp/grubaa64.efi"
            fi
          fi
          
          # 复制EFI引导文件
          if [ -n "$BOOTAA64_EFI" ] && [ -f "$BOOTAA64_EFI" ]; then
            echo "复制 BOOTAA64.EFI 从: $BOOTAA64_EFI"
            sudo cp "$BOOTAA64_EFI" /tmp/iso_fix/EFI/BOOT/BOOTAA64.EFI
          else
            echo "错误: 无法找到BOOTAA64.EFI文件"
          fi
          
          # 复制GRUB EFI文件
          if [ -n "$EFI_GRUB" ] && [ -f "$EFI_GRUB" ]; then
            echo "复制 grubaa64.efi 从: $EFI_GRUB"
            sudo cp "$EFI_GRUB" /tmp/iso_fix/EFI/BOOT/grubaa64.efi
          fi
          
          # 确保grub.cfg存在且配置正确
          sudo mkdir -p /tmp/iso_fix/boot/grub
          
          if [ ! -f "/tmp/iso_fix/boot/grub/grub.cfg" ]; then
            echo "创建基本的 grub.cfg"
            sudo tee /tmp/iso_fix/boot/grub/grub.cfg > /dev/null <<EOF
        set default=0
        set timeout=10
        
        insmod efi_gop
        insmod efi_uga
        insmod font
        insmod gfxterm
        insmod png
        insmod jpeg
        
        if loadfont /boot/grub/fonts/unicode.pf2; then
            set gfxmode=auto
            insmod all_video
            terminal_output gfxterm
        fi
        
        menuentry "Rescuezilla" {
            linux /casper/vmlinuz boot=casper noeject noprompt quiet splash --
            initrd /casper/initrd
        }
        
        menuentry "Rescuezilla (Safe Mode)" {
            linux /casper/vmlinuz boot=casper noeject noprompt quiet splash nomodeset --
            initrd /casper/initrd
        }
        EOF
          fi
          
          # 创建UEFI grub.cfg (用于EFI引导)
          sudo mkdir -p /tmp/iso_fix/EFI/BOOT
          sudo cp /tmp/iso_fix/boot/grub/grub.cfg /tmp/iso_fix/EFI/BOOT/grub.cfg
          
          # 确保文件权限正确
          sudo chmod 644 /tmp/iso_fix/EFI/BOOT/* 2>/dev/null || true
          sudo chmod 644 /tmp/iso_fix/boot/grub/grub.cfg
          
          echo "=== 重新生成 ISO ==="
          # 重新创建ISO，检查是否存在isolinux
          XORRISO_ARGS="-r -V 'Rescuezilla' -J -joliet-long -cache-inodes"
          
          if [ -f "/tmp/iso_fix/isolinux/isolinux.bin" ]; then
            XORRISO_ARGS="$XORRISO_ARGS -b isolinux/isolinux.bin -c isolinux/boot.cat -boot-load-size 4 -boot-info-table -no-emul-boot -eltorito-alt-boot"
          fi
          
          XORRISO_ARGS="$XORRISO_ARGS -e EFI/BOOT/BOOTAA64.EFI -no-emul-boot -boot-load-size 1 -isohybrid-gpt-basdat"
          
          sudo xorriso -as mkisofs $XORRISO_ARGS \
            -o "${ISO_FILE}.fixed" \
            /tmp/iso_fix/
          
          # 替换原ISO
          sudo mv "${ISO_FILE}.fixed" "$ISO_FILE"
          
          # 清理临时文件
          sudo rm -rf /tmp/iso_fix /tmp/iso_mount
          rm -f /tmp/grubaa64.efi /tmp/grub_standalone.cfg
        fi
        
    - name: Check build output
      run: |
        echo "=== 检查构建输出 ==="
        ls -la build/
        
        ISO_FILE="build/rescuezilla.arm64.noble.iso"
        
        if [ -f "$ISO_FILE" ]; then
          echo "✅ ISO 文件创建成功"
          echo "ISO 文件大小: $(ls -lh "$ISO_FILE" | awk '{print $5}')"
          
          # 检查ISO内容
          echo "=== 检查ISO中的EFI引导文件 ==="
          mkdir -p /tmp/iso_check
          sudo mount -o loop "$ISO_FILE" /tmp/iso_check 2>/dev/null || true
          
          if [ -d "/tmp/iso_check/EFI" ]; then
            echo "找到EFI目录:"
            find /tmp/iso_check/EFI -type f 2>/dev/null | head -10
          fi
          
          # 特别检查ARM64 UEFI引导文件
          if [ -f "/tmp/iso_check/EFI/BOOT/BOOTAA64.EFI" ]; then
            echo "✅ 找到 BOOTAA64.EFI (ARM64 UEFI引导文件)"
            ls -la /tmp/iso_check/EFI/BOOT/BOOTAA64.EFI
          else
            echo "❌ 未找到 BOOTAA64.EFI"
          fi
          
          if [ -f "/tmp/iso_check/EFI/BOOT/grubaa64.efi" ]; then
            echo "✅ 找到 grubaa64.efi (GRUB ARM64 UEFI引导文件)"
            ls -la /tmp/iso_check/EFI/BOOT/grubaa64.efi
          else
            echo "❌ 未找到 grubaa64.efi"
          fi
          
          if [ -f "/tmp/iso_check/EFI/BOOT/grub.cfg" ]; then
            echo "✅ 找到 EFI grub.cfg"
            echo "grub.cfg 内容:"
            head -20 /tmp/iso_check/EFI/BOOT/grub.cfg
          else
            echo "❌ 未找到 EFI grub.cfg"
          fi
          
          if [ -f "/tmp/iso_check/boot/grub/grub.cfg" ]; then
            echo "✅ 找到主 grub.cfg"
          else
            echo "❌ 未找到主 grub.cfg"
          fi
          
          # 检查内核和initrd
          if [ -f "/tmp/iso_check/casper/vmlinuz" ]; then
            echo "✅ 找到内核文件"
          else
            echo "❌ 未找到内核文件"
          fi
          
          if [ -f "/tmp/iso_check/casper/initrd" ] || [ -f "/tmp/iso_check/casper/initrd.lz" ]; then
            echo "✅ 找到initrd文件"
          else
            echo "❌ 未找到initrd文件"
          fi
          
          sudo umount /tmp/iso_check 2>/dev/null || true
          rm -rf /tmp/iso_check
        else
          echo "❌ ISO 文件未生成"
          exit 1
        fi
        
    - name: Test QEMU UEFI Boot
      run: |
        echo "=== 测试 QEMU UEFI 引导 ==="
        ISO_FILE="build/rescuezilla.arm64.noble.iso"
        
        if [ -f "$ISO_FILE" ]; then
          # 检查QEMU是否可用
          if command -v qemu-system-aarch64 >/dev/null 2>&1; then
            echo "QEMU ARM64 可用"
            
            # 检查UEFI固件文件
            UEFI_CODE=""
            if [ -f "/usr/share/qemu-efi-aarch64/QEMU_EFI.fd" ]; then
              UEFI_CODE="/usr/share/qemu-efi-aarch64/QEMU_EFI.fd"
            elif [ -f "/usr/share/AAVMF/AAVMF_CODE.fd" ]; then
              UEFI_CODE="/usr/share/AAVMF/AAVMF_CODE.fd"
            fi
            
            if [ -n "$UEFI_CODE" ]; then
              echo "找到UEFI固件: $UEFI_CODE"
              
              # 创建UEFI变量存储
              UEFI_VARS="/tmp/QEMU_VARS.fd"
              if [ -f "/usr/share/qemu-efi-aarch64/QEMU_VARS.fd" ]; then
                cp /usr/share/qemu-efi-aarch64/QEMU_VARS.fd "$UEFI_VARS"
              elif [ -f "/usr/share/AAVMF/AAVMF_VARS.fd" ]; then
                cp /usr/share/AAVMF/AAVMF_VARS.fd "$UEFI_VARS"
              else
                # 创建空的变量文件
                dd if=/dev/zero of="$UEFI_VARS" bs=1M count=64 2>/dev/null
              fi
              
              echo "启动 QEMU 测试 (10秒超时)"
              timeout 10s qemu-system-aarch64 \
                -M virt \
                -cpu cortex-a57 \
                -smp 2 \
                -m 1024 \
                -drive if=pflash,format=raw,readonly=on,file="$UEFI_CODE" \
                -drive if=pflash,format=raw,file="$UEFI_VARS" \
                -cdrom "$ISO_FILE" \
                -boot d \
                -nographic \
                -serial stdio || echo "QEMU 测试完成 (预期超时)"
            else
              echo "未找到UEFI固件文件，跳过QEMU测试"
            fi
          else
            echo "QEMU ARM64 不可用，跳过测试"
          fi
        fi
        
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: rescuezilla-arm64.iso
        path: build/rescuezilla.arm64.noble.iso
        
    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/rescuezilla.arm64.noble.iso
        body: |
          Rescuezilla ARM64 ISO
          Build from commit: ${{ github.sha }}
          
          This ISO supports ARM64/AArch64 UEFI boot.
          
          Key features:
          - ARM64 UEFI boot support
          - GRUB bootloader with proper configuration
          - Compatible with ARM64 hardware and virtual machines
        prerelease: false
